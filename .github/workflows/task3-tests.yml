name: Task 3 Tests

on:
  pull_request:
  push:
    branches:
      - "task3/**"
      - "Task3/**"

jobs:
  test:
    if: >-
      (github.event_name == 'push') ||
      startsWith(github.head_ref, 'task3/') ||
      startsWith(github.head_ref, 'Task3/')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: task3

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file for testing
        run: echo "secret_key=test-secret-key-for-ci-only" > .env

      - name: Run tests with coverage (must be > 98%)
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=98
